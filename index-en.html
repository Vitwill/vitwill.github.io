    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        /* ============================================================
           ТОКЕНЫ
           ============================================================ */
        :root {
            --paper: #F5F2EC;
            --paper-2: #EFEBE3;
            --ink: #0E0E0E;
            --muted: rgba(14, 14, 14, .68);
            --muted-2: rgba(14, 14, 14, .45);
            --line: rgba(14, 14, 14, .14);
            --line-strong: rgba(14, 14, 14, .22);
            --line-dark: rgba(245, 242, 236, .14);
            --accent: #C1440E;
            --accent-soft: #E8A87C;

            --f-display: 'Inter Tight', sans-serif;
            --f-text: 'Inter', sans-serif;
            --f-serif: 'Instrument Serif', serif;
            --f-mono: 'JetBrains Mono', monospace;

            --ease: cubic-bezier(0.22, 1, 0.36, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: var(--f-text);
            font-weight: 400;
            font-size: 15px;
            line-height: 1.6;
            color: var(--ink);
            background: var(--paper);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        img { max-width: 100%; display: block; }
        a { color: inherit; }
        ::selection { background: var(--ink); color: var(--paper); }

        .container { max-width: 1440px; margin: 0 auto; padding: 0 40px; }

        /* ============================================================
           ОБЩИЕ ЛЕЙБЛЫ
           ============================================================ */
        .eyebrow {
            font-family: var(--f-mono);
            font-size: 11px;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: var(--accent);
            display: inline-flex;
            align-items: center;
            gap: 14px;
        }
        .eyebrow::before {
            content: "";
            display: inline-block;
            width: 32px;
            height: 1px;
            background: var(--accent);
        }
        .eyebrow-dark { color: var(--accent-soft); }
        .eyebrow-dark::before { background: var(--accent-soft); }

        /* SIDE NAV */
        .side-nav {
            position: fixed; right: 30px; top: 50%; transform: translateY(-50%);
            z-index: 90;
            display: flex; flex-direction: column; gap: 22px;
            padding: 16px 0;
        }
        .side-nav-item {
            width: 32px; height: 2px; background: rgba(14,14,14,.28);
            border-radius: 1px; cursor: pointer;
            transition: all .35s var(--ease);
            position: relative;
        }
        .side-nav-item:hover { background: rgba(14,14,14,.6); transform: scaleX(1.3); }
        .side-nav-item.active { background: var(--ink); width: 44px; }
        .side-nav-item.active::after {
            content: "";
            position: absolute; left: -8px; top: 50%;
            width: 4px; height: 4px; border-radius: 50%;
            background: var(--accent);
            transform: translateY(-50%);
        }
        .side-nav-item::before {
            content: attr(data-label);
            position: absolute; right: 52px; top: 50%;
            transform: translateY(-50%);
            font-family: var(--f-mono);
            font-size: 10px;
            letter-spacing: .16em;
            text-transform: uppercase;
            color: var(--ink);
            white-space: nowrap;
            opacity: 0;
            transition: all .3s var(--ease);
            pointer-events: none;
        }
        .side-nav-item:hover::before { opacity: 1; right: 56px; }

        /* HEADER */
        .site-header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            background: rgba(245, 242, 236, .85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--line);
            transition: padding .3s var(--ease);
        }
        .site-header .container {
            display: flex; justify-content: space-between; align-items: center;
            padding-top: 20px; padding-bottom: 20px;
            transition: padding .3s var(--ease);
        }
        .site-header.scrolled .container { padding-top: 14px; padding-bottom: 14px; }

        .logo {
            font-family: var(--f-display);
            font-size: 17px; font-weight: 600;
            letter-spacing: -.02em;
            text-decoration: none;
            color: var(--ink);
        }
        .logo em {
            font-family: var(--f-serif);
            font-style: italic; font-weight: 400;
            color: var(--accent);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .btn-tools {
            display: inline-flex;
            align-items: center;
            font-family: var(--f-mono);
            font-size: 11px;
            letter-spacing: .16em;
            text-transform: uppercase;
            text-decoration: none;
            background: var(--ink);
            color: var(--paper);
            border: 1px solid var(--ink);
            padding: 12px 20px;
            border-radius: 2px;
            transition: all .3s var(--ease);
        }
        .btn-tools:hover {
            background: var(--accent);
            border-color: var(--accent);
        }
        .lang-switch {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: var(--f-mono);
            font-size: 11px;
            letter-spacing: .1em;
            color: var(--ink);
            text-decoration: none;
            padding: 11px 14px;
            border: 1px solid var(--line-strong);
            border-radius: 2px;
            transition: all .3s var(--ease);
        }
        .lang-switch:hover {
            background: rgba(14,14,14,.05);
            border-color: rgba(14,14,14,.45);
        }

        /* HERO */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 160px 0 80px;
            background: var(--paper);
            border-bottom: 1px solid var(--line);
        }
        .hero::before {
            content: "";
            position: absolute; inset: 0;
            background-image: linear-gradient(90deg, var(--line) 1px, transparent 1px);
            background-size: 25% 100%;
            opacity: .5;
            pointer-events: none;
        }
        .hero .container {
            position: relative; z-index: 1;
            display: flex; flex-direction: column;
            gap: 60px; width: 100%;
        }
        .hero-top {
            display: flex; justify-content: space-between;
            align-items: baseline; gap: 40px;
        }
        .hero-loc {
            font-family: var(--f-mono);
            font-size: 11px;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--muted);
            text-align: right;
            line-height: 1.9;
        }
        .hero-name {
            font-family: var(--f-display);
            font-size: clamp(64px, 14vw, 210px);
            font-weight: 600;
            line-height: .86;
            letter-spacing: -.055em;
            margin-left: -.04em;
        }
        .hero-dot {
            display: inline-block;
            width: .1em; height: .1em;
            background: var(--accent);
            border-radius: 50%;
            vertical-align: baseline;
            margin-left: .06em;
            margin-bottom: .05em;
        }
        .hero-bottom {
            display: grid;
            grid-template-columns: 1.5fr 1fr 1fr;
            gap: 60px;
            padding-top: 40px;
            border-top: 1px solid var(--line);
        }
        .hero-role {
            font-family: var(--f-serif);
            font-size: clamp(22px, 2.2vw, 30px);
            font-style: italic;
            line-height: 1.35;
            letter-spacing: -.01em;
            max-width: 480px;
        }
        .hero-hl {
            background: linear-gradient(transparent 62%, var(--accent-soft) 62%);
            padding: 0 2px;
        }
        .hero-meta { font-size: 13px; }
        .hero-meta-row {
            display: flex; justify-content: space-between; gap: 20px;
            padding: 8px 0;
            border-bottom: 1px dashed var(--line-strong);
        }
        .hero-meta-row:last-child { border-bottom: none; }
        .hero-meta-row span:first-child {
            font-family: var(--f-mono);
            font-size: 10px;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--muted);
            padding-top: 2px;
        }
        .hero-meta-row span:last-child { text-align: right; }
        .hero-scroll {
            position: absolute; bottom: 40px; left: 60px;
            display: inline-flex; align-items: center; gap: 14px;
            text-decoration: none; color: var(--muted);
            font-family: var(--f-mono);
            font-size: 10px;
            letter-spacing: .2em;
            text-transform: uppercase;
            transition: color .3s;
            z-index: 2;
        }
        .hero-scroll::after {
            content: ""; display: block;
            width: 60px; height: 1px; background: currentColor;
        }
        .hero-scroll:hover { color: var(--ink); }

        /* MARQUEE */
        .marquee {
            overflow: hidden;
            padding: 22px 0;
            border-bottom: 1px solid var(--line);
            background: var(--paper-2);
            white-space: nowrap;
            font-family: var(--f-mono);
            font-size: 12px;
            letter-spacing: .08em;
            text-transform: uppercase;
        }
        .marquee-track {
            display: inline-block;
            animation: marquee 45s linear infinite;
        }
        .marquee-track span { padding: 0 28px; color: var(--muted); }
        .marquee-track span:nth-child(odd) { color: var(--ink); }
        .marquee-track span::after {
            content: "·"; margin-left: 28px; color: var(--accent);
        }
        @keyframes marquee { to { transform: translateX(-50%); } }

        /* FEATURED */
        .featured {
            background: var(--paper-2);
            color: var(--ink);
            padding: 100px 0 90px;
            position: relative;
            border-bottom: 1px solid var(--line);
        }
        .featured::before {
            content: "";
            position: absolute; inset: 0;
            background-image:
                linear-gradient(90deg, var(--line) 1px, transparent 1px),
                linear-gradient(var(--line) 1px, transparent 1px);
            background-size: 80px 80px;
            opacity: .45;
            pointer-events: none;
        }
        .featured .container { position: relative; }
        .featured-head {
            display: flex; justify-content: space-between; align-items: baseline;
            padding-bottom: 26px;
            border-bottom: 1px solid var(--line);
            margin-bottom: 60px;
        }
        .featured-index {
            font-family: var(--f-mono);
            font-size: 12px;
            letter-spacing: .12em;
            color: var(--muted);
        }
        .featured-body {
            display: grid;
            grid-template-columns: 1.55fr 1fr;
            gap: 80px;
            align-items: center;
        }
        .featured-visual {
            position: relative;
            aspect-ratio: 16/11;
            overflow: hidden;
            border-radius: 2px;
            background: linear-gradient(135deg, #E8DCC4 0%, #D4A870 55%, #B8722E 100%);
        }
        .featured-visual img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            transition: transform 1.2s var(--ease);
        }
        .featured-visual:hover img { transform: scale(1.03); }
        .featured-visual::after {
            content: "";
            position: absolute; inset: 0;
            background:
                linear-gradient(180deg, rgba(14,14,14,.05) 0%, transparent 30%, rgba(14,14,14,.72) 100%);
            z-index: 2;
            pointer-events: none;
        }
        .featured-visual-inner {
            position: absolute; inset: 0;
            display: flex; align-items: flex-end;
            padding: 40px;
            z-index: 3;
        }
        .featured-visual-title {
            font-family: var(--f-serif);
            font-style: italic;
            font-size: clamp(32px, 4vw, 62px);
            line-height: 1;
            letter-spacing: -.02em;
            color: var(--paper);
            text-shadow: 0 2px 20px rgba(14,14,14,.35);
        }
        .featured-visual-tag {
            position: absolute; top: 24px; left: 24px; z-index: 4;
            font-family: var(--f-mono);
            font-size: 10px;
            letter-spacing: .16em;
            text-transform: uppercase;
            color: var(--ink);
            padding: 6px 12px;
            border: 1px solid rgba(14,14,14,.3);
            border-radius: 2px;
            backdrop-filter: blur(8px);
            background: rgba(245,242,236,.85);
        }
        .featured-meta-list { margin-bottom: 36px; }
        .featured-meta-row {
            display: flex; justify-content: space-between; gap: 20px;
            padding: 12px 0;
            border-bottom: 1px solid var(--line);
            font-size: 14px;
        }
        .featured-meta-row:first-child { border-top: 1px solid var(--line); }
        .featured-meta-row span:first-child {
            font-family: var(--f-mono);
            font-size: 10px;
            letter-spacing: .16em;
            text-transform: uppercase;
            color: var(--muted);
            padding-top: 2px;
        }
        .featured-meta-row span:last-child { text-align: right; color: var(--ink); }
        .featured-quote {
            font-family: var(--f-serif);
            font-size: 22px;
            font-style: italic;
            line-height: 1.4;
            color: var(--ink);
            margin-bottom: 36px;
            padding-left: 20px;
            border-left: 2px solid var(--accent);
        }
        .featured-cta {
            display: inline-flex; align-items: center; gap: 14px;
            font-family: var(--f-mono);
            font-size: 12px;
            letter-spacing: .16em;
            text-transform: uppercase;
            text-decoration: none;
            color: var(--paper);
            background: var(--ink);
            border: 1px solid var(--ink);
            padding: 16px 28px;
            border-radius: 2px;
            transition: all .3s var(--ease);
        }
        .featured-cta:hover {
            background: var(--accent);
            border-color: var(--accent);
            gap: 20px;
        }
        .featured-strip {
            display: flex;
            margin-top: 80px;
            padding-top: 26px;
            border-top: 1px solid var(--line);
        }
        .featured-strip-item {
            flex: 1;
            padding: 8px 16px 8px 0;
            font-family: var(--f-mono);
            font-size: 10px;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--muted);
            border-right: 1px solid var(--line);
            cursor: pointer;
            transition: color .2s;
            display: flex; align-items: center; gap: 10px;
        }
        .featured-strip-item:last-child { border-right: none; }
        .featured-strip-item:hover { color: var(--ink); }
        .featured-strip-item.active { color: var(--ink); }
        .featured-strip-item::before {
            content: "";
            width: 6px; height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
            border: 1px solid var(--muted-2);
        }
        .featured-strip-item.active::before {
            background: var(--accent);
            border-color: var(--accent);
        }

        /* ABOUT */
        .about { padding: 120px 0; border-bottom: 1px solid var(--line); }
        .about-grid {
            display: grid;
            grid-template-columns: .9fr 1.1fr;
            gap: 100px;
            align-items: start;
        }
        .about-image {
            position: relative;
            aspect-ratio: 4/5;
            overflow: hidden;
            border-radius: 2px;
            background: linear-gradient(135deg, #d9cfc0 0%, #b6a994 100%);
        }
        .about-image img {
            width: 100%; height: 100%; object-fit: cover;
            display: block;
            transition: transform .8s var(--ease);
        }
        .about-image:hover img { transform: scale(1.02); }
        .about-image::after {
            content: "";
            position: absolute; inset: 0;
            background: radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.25), transparent 55%);
            pointer-events: none;
        }
        .about-content h2 {
            font-family: var(--f-display);
            font-size: clamp(32px, 3.6vw, 52px);
            font-weight: 500;
            letter-spacing: -.035em;
            line-height: 1.05;
            margin: 24px 0 12px;
        }
        .about-content h2 em {
            font-family: var(--f-serif);
            font-style: italic;
            font-weight: 400;
        }
        .about-role {
            font-family: var(--f-mono);
            font-size: 11px;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 32px;
        }
        .about-text {
            font-size: 16px;
            line-height: 1.75;
            color: var(--muted);
            margin-bottom: 20px;
            max-width: 620px;
        }
        .about-text:last-of-type { margin-bottom: 40px; }
        .about-buttons {
            display: flex; gap: 14px; flex-wrap: wrap;
            padding-top: 32px;
            border-top: 1px solid var(--line);
        }

        .btn {
            display: inline-flex; align-items: center; gap: 12px;
            font-family: var(--f-mono);
            font-size: 12px;
            letter-spacing: .16em;
            text-transform: uppercase;
            text-decoration: none;
            padding: 16px 28px;
            border: 1px solid transparent;
            border-radius: 2px;
            cursor: pointer;
            transition: all .3s var(--ease);
            background: none;
        }
        .btn-dark {
            background: var(--ink);
            color: var(--paper);
            border-color: var(--ink);
        }
        .btn-dark:hover { background: var(--accent); border-color: var(--accent); }
        .btn-outline {
            background: transparent;
            color: var(--ink);
            border-color: var(--line-strong);
        }
        .btn-outline:hover { border-color: var(--ink); }

        /* SECTION HEAD */
        .section-head {
            display: flex; justify-content: space-between; align-items: baseline;
            padding-bottom: 30px;
            border-bottom: 1px solid var(--line);
            margin-bottom: 0;
        }
        .section-head h2 {
            font-family: var(--f-display);
            font-size: clamp(32px, 4.5vw, 58px);
            font-weight: 500;
            letter-spacing: -.04em;
            line-height: 1;
            margin-top: 16px;
        }
        .section-head h2 em {
            font-family: var(--f-serif);
            font-style: italic;
            font-weight: 400;
        }
        .section-head .count {
            font-family: var(--f-mono);
            font-size: 11px;
            letter-spacing: .14em;
            color: var(--muted);
            text-transform: uppercase;
        }

        /* PORTFOLIO */
        .portfolio { padding: 110px 0; border-bottom: 1px solid var(--line); }
        .work-list { margin-top: 8px; }
        .work-row {
            display: grid;
            grid-template-columns: 60px minmax(0, 1.7fr) minmax(0, 1fr) minmax(0, 1fr) 40px;
            gap: 24px;
            align-items: center;
            padding: 26px 0;
            border-bottom: 1px solid var(--line);
            text-decoration: none;
            color: inherit;
            transition: padding .35s var(--ease), background .35s var(--ease);
        }
        .work-row:hover {
            padding-left: 24px;
            padding-right: 24px;
            background: var(--ink);
            color: var(--paper);
        }
        .work-row .num {
            font-family: var(--f-mono);
            font-size: 11px;
            color: var(--muted-2);
            transition: color .3s;
        }
        .work-row:hover .num { color: var(--accent-soft); }
        .work-row .name {
            font-family: var(--f-display);
            font-size: clamp(20px, 2.2vw, 30px);
            font-weight: 500;
            letter-spacing: -.02em;
            line-height: 1.1;
        }
        .work-row .name em {
            font-family: var(--f-serif);
            font-style: italic;
            font-weight: 400;
        }
        .work-row .cat, .work-row .geo {
            font-size: 13px;
            color: var(--muted);
            transition: color .3s;
        }
        .work-row:hover .cat, .work-row:hover .geo { color: rgba(245,242,236,.75); }
        .work-row .arrow {
            font-size: 20px;
            text-align: right;
            color: var(--muted-2);
            transition: transform .3s var(--ease), color .3s;
        }
        .work-row:hover .arrow {
            transform: translateX(8px);
            color: var(--accent-soft);
        }

        /* STATS */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            border-bottom: 1px solid var(--line);
            background: var(--paper-2);
        }
        .stat {
            padding: 50px 40px;
            border-right: 1px solid var(--line);
        }
        .stat:last-child { border-right: none; }
        .stat .num {
            font-family: var(--f-display);
            font-size: clamp(40px, 5vw, 72px);
            font-weight: 500;
            letter-spacing: -.045em;
            line-height: 1;
        }
        .stat .num sup {
            font-size: .45em;
            color: var(--accent);
            vertical-align: super;
            letter-spacing: 0;
        }
        .stat .lbl {
            font-family: var(--f-mono);
